<!--
  GET /checkout.html?products=id:qty,id:qty&coupon=CODE

  This is the "Checkout URL" Meta Commerce Manager calls when a shopper taps
  checkout from the Yumikaai shop on Facebook or Instagram (Settings > Shop
  details > Checkout URL).

  yumikaai.com is a static GitHub Pages site (see CNAME / .nojekyll in this
  repo) -- there is no server-side runtime behind it, so this can't be a
  Netlify Function. Instead this is a plain static page: the product-id ->
  Etsy-listing-URL map (PRODUCT_LINKS below, mirrors data/product-links.json)
  is embedded directly and the redirect logic runs entirely in the browser.

    - Exactly one distinct product  -> redirect straight to Etsy.
    - Several different listings    -> Etsy has no cross-listing cart URL,
                                        so show one "Continue on Etsy" button
                                        per item instead of a dead end.
    - Unknown / unmapped product ID -> fall back to the Etsy storefront.

  IMPORTANT: keep PRODUCT_LINKS below (and data/product-links.json) in sync
  with the CSV used to build the Facebook/Instagram catalog feed -- when new
  products are added there, re-export and update both so checkout can
  resolve them too.
-->
<style>
  :root{ --paper:#fbf3e7; --ink:#241c15; --ink-soft:#5a4d3f; --coral:#e2552b; --teal:#177f77; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Karla,system-ui,-apple-system,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:440px;width:100%;background:#fff;border-radius:20px;padding:32px 28px;
        box-shadow:0 10px 30px rgba(36,28,21,0.10);}
  h1{font-family:"Baloo 2",sans-serif;font-size:22px;margin:0 0 8px;}
  p.sub{color:var(--ink-soft);margin:0 0 24px;font-size:14px;line-height:1.5;}
  .item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;
        border:1px solid #eee0cc;text-decoration:none;color:var(--ink);margin-bottom:10px;
        transition:border-color .15s;}
  .item:hover{border-color:var(--coral);}
  .num{width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;
       display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
  .label{flex:1;font-weight:600;font-size:14px;}
  .arrow{color:var(--coral);font-weight:700;}
  .note{margin-top:20px;font-size:12px;color:var(--ink-soft);}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid #eee0cc;border-top-color:var(--coral);
       animation:spin 0.8s linear infinite;margin:0 0 16px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

  const ETSY_SHOP_URL = "https://www.etsy.com/shop/yumikaai";

  function parseProductIds(raw) {
    if (!raw) return [];
    return raw.split(",").map((entry) => entry.split(":")[0].trim()).filter(Boolean);
  }

  const params = new URLSearchParams(window.location.search);
  const ids = parseProductIds(params.get("products"));
  const resolved = ids.map((id) => PRODUCT_LINKS[id]).filter(Boolean);
  const uniqueUrls = Array.from(new Set(resolved));

  if (uniqueUrls.length === 0) {
    window.location.replace(ETSY_SHOP_URL);
  } else if (uniqueUrls.length === 1) {
    window.location.replace(uniqueUrls[0]);
  } else {
    document.getElementById("spinner").style.display = "none";
    document.getElementById("heading").textContent = "Almost there!";
    document.getElementById("sub").textContent =
      "Your order includes " + uniqueUrls.length +
      " items from different listings. Etsy checks out one listing at a time, so open each one below to finish your purchase securely on Etsy.";
    const itemsDiv = document.getElementById("items");
    uniqueUrls.forEach((url, i) => {
      const a = document.createElement("a");
      a.className = "item";
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML =
        '<span class="num">' + (i + 1) + '</span>' +
        '<span class="label">Continue to item ' + (i + 1) + ' on Etsy</span>' +
        '<span class="arrow">&rarr;</span>';
      itemsDiv.appendChild(a);
    });
  }
